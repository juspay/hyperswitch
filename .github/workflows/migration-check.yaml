name: Migration Consistency Tests

on:
  pull_request:

  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Allow more retries for network requests in cargo (downloading crates) and
  # rustup (installing toolchains). This should help to reduce flaky CI failures
  # from transient network timeouts or other issues.
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  migration_verify:
    name: Verify consistency of migrations with `schema.rs` file
    runs-on: hypersage-runners

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hyperswitch_db
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: 5432

    services:
      postgres:
        image: "public.ecr.aws/docker/library/postgres:alpine"
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable 2 weeks ago
          components: rustfmt

      - uses: taiki-e/install-action@v2
        with:
          tool: diesel_cli

      - uses: taiki-e/install-action@v2
        with:
          tool: just
          checksum: true

      - name: Create database
        shell: bash
        run: just resurrect hyperswitch_db

      - name: Verify `diesel migration run for v1`
        shell: bash
        run: just migrate run --locked-schema

      - name: Verify `diesel migration redo for v1`
        shell: bash
        run: just migrate redo --locked-schema --all

      - name: Drop `DB for v2 column ordering mismatch`
        shell: bash
        run: just resurrect hyperswitch_db

      - name: Verify `diesel migration run for v2`
        shell: bash
        run: just migrate_v2 run --locked-schema

      - name: Verify `diesel migration redo for v2`
        shell: bash
        run: just migrate_v2 redo --locked-schema --all

      - name: Verify setup migrations do not require `rustfmt`
        shell: bash
        run: |
          # The `migration_runner` setup containers do not have `rustfmt`, and they must not
          # regenerate `crates/diesel_models/src/schema.rs` inside the user's checkout.
          # `just migrate_setup` uses `diesel_migration.toml`, which has no `[print_schema]`
          # section, so it only applies migrations. Hide `rustfmt` to reproduce the container
          # environment and fail here if `print-schema` (and its patch file) is ever run again.
          rustfmt_path="$(command -v rustfmt || true)"
          if [[ -z "${rustfmt_path}" ]]; then
            echo "::error::rustfmt is not installed, cannot verify the setup migration path"
            exit 1
          fi
          mv "${rustfmt_path}" "${rustfmt_path}.disabled"
          trap 'mv "${rustfmt_path}.disabled" "${rustfmt_path}"' EXIT

          just resurrect hyperswitch_db
          just migrate_setup

          # `print-schema` rewrites `schema.rs` via `drop_id.patch`; the setup path must not.
          git diff --exit-code -- crates/diesel_models/src/schema.rs
