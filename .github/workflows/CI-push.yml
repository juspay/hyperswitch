name: CI-push

on:
  push:
    branches:
      - main

  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Disable incremental compilation.
  #
  # Incremental compilation is useful as part of an edit-build-test-edit cycle,
  # as it lets the compiler avoid recompiling code that hasn't changed. However,
  # on CI, we're not making small edits; we're almost always building the entire
  # project from scratch. Thus, incremental compilation on CI actually
  # introduces *additional* overhead to support making future builds
  # faster...but no future builds will ever occur in any given CI environment.
  #
  # See https://matklad.github.io/2021/09/04/fast-rust-builds.html#ci-workflow
  # for details.
  CARGO_INCREMENTAL: 0
  # Allow more retries for network requests in cargo (downloading crates) and
  # rustup (installing toolchains). This should help to reduce flaky CI failures
  # from transient network timeouts or other issues.
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  # Don't emit giant backtraces in the CI logs.
  RUST_BACKTRACE: short

jobs:
  formatting:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt

      - name: Check formatting
        shell: bash
        run: cargo +nightly fmt --all --check

  check-msrv:
    name: Check compilation on MSRV toolchain
    runs-on: ${{ matrix.runner }}

    env:
      RUSTFLAGS: "-D warnings"

    strategy:
      fail-fast: true
      matrix:
        runner:
          - ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mold linker
        uses: rui314/setup-mold@v1
        if: ${{ runner.os == 'Linux' }}
        with:
          make-default: true

      - name: Get rust version from Cargo.toml
        shell: bash
        run: |
          rust_version=$(yq -oy '.workspace.package.rust-version' Cargo.toml)
          echo "rust_version=${rust_version}" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "${{ env.rust_version }}"

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install rust cache
        uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: msrv
          save-if: ${{ github.event_name == 'push' }}
          # `Cargo hack` currently fails on main; without this the post-step is
          # skipped (post-if: success()) and no cache is ever saved for PRs to restore.
          cache-on-failure: true

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
          checksum: true

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
          checksum: true

      - name: Install jq
        shell: bash
        run: .github/scripts/install-jq.sh

      - name: Cargo hack
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: just ci_hack

      - name: Cargo build release
        if: ${{ github.event_name == 'merge_group' }}
        shell: bash
        run: cargo check --features "release"

  # cargo-deny:
  #   name: Run cargo-deny
  #   runs-on: ubuntu-latest
  #   strategy:
  #     matrix:
  #       checks:
  #         - advisories
  #         - bans licenses sources

  #   # Prevent sudden announcement of a new advisory from failing CI
  #   continue-on-error: ${{ matrix.checks == 'advisories' }}

  #   steps:
  #     - name: Checkout repository
  #       uses: actions/checkout@v7

  #     - name: Run cargo-deny
  #       uses: EmbarkStudios/cargo-deny-action@v1.3.2
  #       with:
  #         command: check ${{ matrix.checks }}

  test:
    name: Run tests on stable toolchain
    runs-on: hyperswitch-runners-merge

    env:
      RUSTFLAGS: "-D warnings"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mold linker
        uses: rui314/setup-mold@v1
        if: ${{ runner.os == 'Linux' }}
        with:
          make-default: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable 2 weeks ago
          components: clippy

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Swatinem/rust-cache has no S3 backend, so this replaces it entirely
      # for this job — see .github/scripts/s3-cache-restore.sh for the key
      # scheme and fallback logic.
      - name: Restore cargo/target cache from S3
        continue-on-error: true
        shell: bash
        run: .github/scripts/s3-cache-restore.sh test

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2.83.2
        with:
          tool: cargo-hack
          checksum: true

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
          checksum: true

      - name: Install jq
        shell: bash
        run: .github/scripts/install-jq.sh

      # - name: Install cargo-nextest
      #   uses: taiki-e/install-action@v2
      #   with:
      #     tool: cargo-nextest
      #     checksum: true

      - name: Run clippy (redis-rs backend)
        shell: bash
        env:
          CARGO_BUILD_JOBS: 2
        run: just clippy

      - name: Run clippy (fred backend)
        shell: bash
        env:
          CARGO_BUILD_JOBS: 2
        run: just clippy fred

      - name: Cargo hack
        if: ${{ github.event_name == 'push' }}
        shell: bash
        env:
          CARGO_BUILD_JOBS: 2
        run: just ci_hack

      - name: Cargo build release
        if: ${{ github.event_name == 'merge_group' }}
        shell: bash
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo check --features "release"

      # Only push (not merge_group) writes — same policy the old rust-cache
      # `save-if: github.event_name == 'push'` used. Writes both the exact
      # CACHE_KEY generation and the "latest" pointer PRs fall back to on a
      # miss.
      - name: Save cargo/target cache to S3
        if: ${{ always() && github.event_name == 'push' }}
        continue-on-error: true
        shell: bash
        run: .github/scripts/s3-cache-save.sh test true

  typos:
    name: Spell check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Spell check
        uses: crate-ci/typos@master

  typos-required:
    name: Spell check specific critical directories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Spell check specific directories
        uses: crate-ci/typos@v1.48.0
        with:
          files: |
            api-reference/
            crates/api_models/
            crates/common_utils/
            crates/common_enums/
            crates/diesel_models/
            migrations/
            v2_migrations/
            v2_compatible_migrations/
            config/
            docs/

  check-v2:
    name: Check compilation for V2 features
    runs-on: hyperswitch-runners-merge

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mold linker
        uses: rui314/setup-mold@v1
        if: ${{ runner.os == 'Linux' }}
        with:
          make-default: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable 2 weeks ago

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Swatinem/rust-cache has no S3 backend, so this replaces it entirely
      # for this job — see .github/scripts/s3-cache-restore.sh for the key
      # scheme and fallback logic.
      - name: Restore cargo/target cache from S3
        continue-on-error: true
        shell: bash
        run: .github/scripts/s3-cache-restore.sh check-v2

      - name: Run cargo check enabling only the release and v2 features (redis-rs backend)
        shell: bash
        run: cargo check --no-default-features --features "release,v2,redis-rs"

      - name: Run cargo check enabling only the release and v2 features (fred backend)
        shell: bash
        run: cargo check --no-default-features --features "release,v2,fred"

      # Only push (not merge_group) writes — same policy the old rust-cache
      # `save-if: github.event_name == 'push'` used. Writes both the exact
      # CACHE_KEY generation and the "latest" pointer PRs fall back to on a
      # miss.
      - name: Save cargo/target cache to S3
        if: ${{ always() && github.event_name == 'push' }}
        continue-on-error: true
        shell: bash
        run: .github/scripts/s3-cache-save.sh check-v2 true
