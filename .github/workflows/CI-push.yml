name: CI-push

on:
  push:
    branches:
      - main

  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Disable incremental compilation.
  #
  # Incremental compilation is useful as part of an edit-build-test-edit cycle,
  # as it lets the compiler avoid recompiling code that hasn't changed. However,
  # on CI, we're not making small edits; we're almost always building the entire
  # project from scratch. Thus, incremental compilation on CI actually
  # introduces *additional* overhead to support making future builds
  # faster...but no future builds will ever occur in any given CI environment.
  #
  # See https://matklad.github.io/2021/09/04/fast-rust-builds.html#ci-workflow
  # for details.
  CARGO_INCREMENTAL: 0
  # Allow more retries for network requests in cargo (downloading crates) and
  # rustup (installing toolchains). This should help to reduce flaky CI failures
  # from transient network timeouts or other issues.
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  # Don't emit giant backtraces in the CI logs.
  RUST_BACKTRACE: short

jobs:
  formatting:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt

      - name: Check formatting
        shell: bash
        run: cargo +nightly fmt --all --check

  check-msrv:
    name: Check compilation on MSRV toolchain
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      # actions/cache keys are immutable; needed for `gh cache delete`.
      actions: write

    env:
      # sccache on local disk via actions/cache, not SCCACHE_GHA_ENABLED
      # (proven slower here before — see git log for check-msrv).
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: "2G"
      RUSTFLAGS: "-D warnings"

    strategy:
      fail-fast: true
      matrix:
        runner:
          - ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mold linker
        uses: rui314/setup-mold@v1
        if: ${{ runner.os == 'Linux' }}
        with:
          make-default: true

      - name: Get rust version from Cargo.toml
        shell: bash
        run: |
          rust_version=$(yq -oy '.workspace.package.rust-version' Cargo.toml)
          echo "rust_version=${rust_version}" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "${{ env.rust_version }}"

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install sccache
        uses: taiki-e/install-action@v2
        with:
          tool: sccache
          checksum: true

      - name: Restore sccache cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-local-check-msrv-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
          checksum: true

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
          checksum: true

      - name: Install jq
        shell: bash
        run: .github/scripts/install-jq.sh

      - name: Cargo hack
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: just ci_hack

      - name: Cargo build release
        if: ${{ github.event_name == 'merge_group' }}
        shell: bash
        run: cargo check --features "release"

      - name: Show sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats

      # always(): save even if the build failed (cache-on-failure).
      - name: Delete stale sccache cache entry
        if: ${{ always() && github.event_name == 'push' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh cache delete "sccache-local-check-msrv-${{ runner.os }}-${{ runner.arch }}" --repo "${{ github.repository }}"

      - name: Save sccache cache
        if: ${{ always() && github.event_name == 'push' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-local-check-msrv-${{ runner.os }}-${{ runner.arch }}

  # cargo-deny:
  #   name: Run cargo-deny
  #   runs-on: ubuntu-latest
  #   strategy:
  #     matrix:
  #       checks:
  #         - advisories
  #         - bans licenses sources

  #   # Prevent sudden announcement of a new advisory from failing CI
  #   continue-on-error: ${{ matrix.checks == 'advisories' }}

  #   steps:
  #     - name: Checkout repository
  #       uses: actions/checkout@v7

  #     - name: Run cargo-deny
  #       uses: EmbarkStudios/cargo-deny-action@v1.3.2
  #       with:
  #         command: check ${{ matrix.checks }}

  test:
    name: Run tests on stable toolchain
    runs-on: hyperswitch-runners-merge

    env:
      # sccache on local disk, restored/saved as one archive instead of its
      # native S3 backend — see CI-pr.yml's `test` for why. This job
      # populates the shared cache: PRs restore-only, this saves on `push`.
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: "4G"
      RUSTFLAGS: "-D warnings"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mold linker
        uses: rui314/setup-mold@v1
        if: ${{ runner.os == 'Linux' }}
        with:
          make-default: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable 2 weeks ago
          components: clippy

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2.83.2
        with:
          tool: cargo-hack
          checksum: true

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
          checksum: true

      - name: Install jq
        shell: bash
        run: .github/scripts/install-jq.sh

      - name: Mask S3 cache location in job logs
        shell: bash
        run: .github/scripts/sccache-mask-s3-env.sh

      - name: Install sccache
        uses: taiki-e/install-action@v2
        with:
          tool: sccache
          checksum: true

      - name: Resolve S3 cache location, then disable sccache's native S3 backend
        shell: bash
        run: .github/scripts/sccache-resolve-s3-env.sh

      - name: Restore sccache cache from S3
        continue-on-error: true
        shell: bash
        run: .github/scripts/sccache-restore-s3.sh test

      - name: Run clippy (redis-rs backend)
        shell: bash
        # Capped: uncapped + cold cache OOM'd a runner pod (git log).
        env:
          CARGO_BUILD_JOBS: 6
        run: just clippy

      - name: Run clippy (fred backend)
        shell: bash
        env:
          CARGO_BUILD_JOBS: 6
        run: just clippy fred

      - name: Cargo hack
        if: ${{ github.event_name == 'push' }}
        shell: bash
        env:
          CARGO_BUILD_JOBS: 6
        run: just ci_hack

      - name: Cargo build release
        if: ${{ github.event_name == 'merge_group' }}
        shell: bash
        env:
          CARGO_BUILD_JOBS: 6
        run: cargo check --features "release"

      - name: Show sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats

      - name: Save sccache cache to S3
        if: ${{ always() && github.event_name == 'push' }}
        continue-on-error: true
        shell: bash
        run: .github/scripts/sccache-save-s3.sh test

  typos:
    name: Spell check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Spell check
        uses: crate-ci/typos@master

  typos-required:
    name: Spell check specific critical directories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Spell check specific directories
        uses: crate-ci/typos@v1.48.0
        with:
          files: |
            api-reference/
            crates/api_models/
            crates/common_utils/
            crates/common_enums/
            crates/diesel_models/
            migrations/
            v2_migrations/
            v2_compatible_migrations/
            config/
            docs/

  check-v2:
    name: Check compilation for V2 features
    runs-on: hyperswitch-runners-merge

    env:
      # sccache on local disk, restored/saved as a single compressed archive
      # — see `test` for why.
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: "4G"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mold linker
        uses: rui314/setup-mold@v1
        if: ${{ runner.os == 'Linux' }}
        with:
          make-default: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable 2 weeks ago

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mask S3 cache location in job logs
        shell: bash
        run: .github/scripts/sccache-mask-s3-env.sh

      - name: Install sccache
        uses: taiki-e/install-action@v2
        with:
          tool: sccache
          checksum: true

      - name: Resolve S3 cache location, then disable sccache's native S3 backend
        shell: bash
        run: .github/scripts/sccache-resolve-s3-env.sh

      - name: Restore sccache cache from S3
        continue-on-error: true
        shell: bash
        run: .github/scripts/sccache-restore-s3.sh check-v2

      - name: Run cargo check enabling only the release and v2 features (redis-rs backend)
        shell: bash
        env:
          CARGO_BUILD_JOBS: 6
        run: cargo check --no-default-features --features "release,v2,redis-rs"

      - name: Run cargo check enabling only the release and v2 features (fred backend)
        shell: bash
        env:
          CARGO_BUILD_JOBS: 6
        run: cargo check --no-default-features --features "release,v2,fred"

      - name: Show sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats

      - name: Save sccache cache to S3
        if: ${{ always() && github.event_name == 'push' }}
        continue-on-error: true
        shell: bash
        run: .github/scripts/sccache-save-s3.sh check-v2
