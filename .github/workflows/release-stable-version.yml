name: Release a stable version

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: The part of the semantic version to bump.
        required: true
        type: choice
        options:
          - patch
          - minor

jobs:
  create-semver-tag:
    name: Create a SemVer tag
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub app token
        id: generate_app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.HYPERSWITCH_BOT_APP_ID }}
          private-key: ${{ secrets.HYPERSWITCH_BOT_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if the input is valid CalVer tag
        shell: bash
        run: |
          if [[ ${{github.ref}} =~ ^refs/tags/[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.([0-9]+))?(-(.+))?$ ]]; then
            echo "${{github.ref}} is a valid CalVer tag."
          else
            echo "::error::${{github.ref}} is not a valid CalVer tag."
            exit 1
          fi

      - name: Check if user is authorized to trigger workflow
        shell: bash
        env:
          GH_TOKEN: ${{ steps.generate_app_token.outputs.token }}
        run: |
          echo "::add-mask::${GH_TOKEN}"

          function is_user_team_member() {
            username="${1}"
            team_slug="${2}"
            org_name=${{ github.repository_owner }}

            # We obtain HTTP status code since the API returns:
            # - 200 status code if the user is a member of the specified team
            # - 404 status code if the user is not a member of the specified team
            #
            # We cannot use the GitHub CLI since it does not seem to provide a way to obtain
            # only the HTTP status code (yet).
            status_code="$(
              curl \
                --location \
                --silent \
                --output /dev/null \
                --write-out '%{http_code}' \
                --header 'Accept: application/vnd.github+json' \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                "https://api.github.com/orgs/${org_name}/teams/${team_slug}/memberships/${username}"
            )"

            # Returns a boolean value, allowing it to be directly used in if conditions
            [[ status_code -eq 200 ]]
          }

          allowed_teams=('hyperswitch-admins' 'hyperswitch-maintainers')
          is_user_authorized=false
          username=${{ github.triggering_actor }}

          for team in "${allowed_teams[@]}"; do
            if is_user_team_member "${username}" "${team}"; then
              is_user_authorized=true
              break
            fi
          done

          if ${is_user_authorized}; then
            echo "${username} is authorized to trigger workflow"
          else
            printf -v allowed_teams_comma_separated '%s, ' "${allowed_teams[@]}"
            echo "::error::${username} is not authorized to trigger workflow; must be a member of one of these teams: ${allowed_teams_comma_separated%, }"
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
          checksum: true

      - name: Install cocogitto
        uses: taiki-e/install-action@v2
        with:
          tool: cocogitto@6.3.0
          checksum: true

      - name: Obtain previous and next tag information
        shell: bash
        run: |
          PREVIOUS_TAG="v$(cog --verbose get-version)"
          NEXT_TAG="$(cog --verbose bump --dry-run "--${{ inputs.bump_type }}")"

          echo "PREVIOUS_TAG=${PREVIOUS_TAG}" >> $GITHUB_ENV
          echo "NEXT_TAG=${NEXT_TAG}" >> $GITHUB_ENV

        # We make use of GitHub API calls to create and update tags
      - name: Create SemVer tag
        shell: bash
        env:
          GH_TOKEN: ${{ steps.generate_app_token.outputs.token }}
        run: |
          # Create a lightweight tag to point to the checked out CalVer tag
          gh api \
            --method POST \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            '/repos/{owner}/{repo}/git/refs' \
            --raw-field "ref=refs/tags/${NEXT_TAG}" \
            --raw-field 'sha=${{ github.sha }}'

      - name: Update `latest` tag to point to newly created SemVer tag
        shell: bash
        env:
          GH_TOKEN: ${{ steps.generate_app_token.outputs.token }}
        run: |
          gh api \
            --method PATCH \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            '/repos/{owner}/{repo}/git/refs/tags/latest' \
            --raw-field 'sha=${{ github.sha }}'

      - name: Generate migration diff
        id: migration-diff
        shell: bash
        run: |
          set -euo pipefail
          if ! DIFF_OUTPUT=$(git diff "$PREVIOUS_TAG" HEAD -- 'migrations/*/up.sql'); then
            echo "::error::git diff failed for migrations/*/up.sql between $PREVIOUS_TAG and $NEXT_TAG"
            exit 1
          fi

          {
            echo "## Migration Diff"
            echo ""
            if [ -z "$DIFF_OUTPUT" ]; then
              echo "No new migrations in this release."
            else
              echo '```diff'
              echo "$DIFF_OUTPUT"
              echo '```'
            fi
            echo ""
          } > /tmp/section-migration-diff.md

      - name: Generate config diffs
        id: config-diffs
        shell: bash
        run: |
          set -euo pipefail
          generate_config_diff_section() {
            local file_path="$1"
            local heading="$2"
            local diff_output

            if ! diff_output=$(git diff --unified=10 --ignore-space-change --ignore-space-at-eol \
              "$PREVIOUS_TAG" HEAD -- "$file_path"); then
              echo "::error::git diff failed for $file_path between $PREVIOUS_TAG and $NEXT_TAG"
              exit 1
            fi

            echo "## $heading"
            echo ""
            if [ -z "$diff_output" ]; then
              echo "No changes to \`$file_path\` in this release."
            else
              echo '```diff'
              echo "$diff_output"
              echo '```'
            fi
            echo ""
          }

          {
            generate_config_diff_section "config/deployments/sandbox.toml" "Config Diff — sandbox.toml"
            generate_config_diff_section "config/deployments/env_specific.toml" "Config Diff — env_specific.toml"
          } > /tmp/section-config-diffs.md

      - name: Generate Docker Images and Compatibility sections
        id: static-sections
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Docker Images"
            echo ""
            echo "${NEXT_TAG} (with AWS SES support): docker pull docker.juspay.io/juspaydotin/hyperswitch-router:${NEXT_TAG}"
            echo ""
            echo "${NEXT_TAG}-standalone (without AWS SES support): docker pull docker.juspay.io/juspaydotin/hyperswitch-router:${NEXT_TAG}-standalone"
            echo ""
          } > /tmp/section-docker-images.md

          {
            echo "## Compatibility"
            echo ""
            echo "Comparing \`${PREVIOUS_TAG}\` → \`${NEXT_TAG}\`."
            echo ""
            echo "<!-- TODO: describe breaking changes, config/API compatibility notes -->"
            echo ""
          } > /tmp/section-compatibility.md

      - name: Generate PR list via git-cliff
        id: pr-list
        shell: bash
        run: |
          set -euo pipefail
          cp .github/git-cliff-changelog.toml /tmp/git-cliff-stable.toml
          sed -i 's/## {{ version }}/## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})/' \
            /tmp/git-cliff-stable.toml

          if ! GIT_CLIFF__GIT__TAG_PATTERN='v[0-9]*' git-cliff \
            --config /tmp/git-cliff-stable.toml \
            --strip header \
            --tag "$NEXT_TAG" \
            "${PREVIOUS_TAG}..HEAD" \
            > /tmp/raw-pr-list.md; then
            echo "::error::git-cliff failed generating PR list for ${PREVIOUS_TAG}..${NEXT_TAG}"
            exit 1
          fi

          awk '
            BEGIN { drop_section = 0 }
            /^### / {
              heading = $0
              gsub(/^### /, "", heading)
              if (heading == "Testing" || heading == "Documentation") {
                drop_section = 1
                next
              } else {
                drop_section = 0
              }
            }
            {
              if (drop_section) next
              line = $0
              lower_line = tolower(line)
              if (lower_line ~ /\*\*deps:\*\*|\*\*dependencies:\*\*|\*\*dependabot:\*\*/) next
              if (lower_line ~ /multitenancy|unified auth|click-to-pay|click to pay/) next
              print
            }
          ' /tmp/raw-pr-list.md > /tmp/filtered-pr-list.md

          if [ ! -s /tmp/filtered-pr-list.md ] && [ -s /tmp/raw-pr-list.md ]; then
            echo "::error::Tier-1 filter produced an empty filtered-pr-list.md from a non-empty raw-pr-list.md -- filter logic likely dropped everything unexpectedly"
            exit 1
          fi

          echo "Raw size: $(wc -c < /tmp/raw-pr-list.md) chars"
          echo "Filtered size: $(wc -c < /tmp/filtered-pr-list.md) chars"

      - name: Assemble body
        id: assemble
        shell: bash
        run: |
          set -euo pipefail

          HARD_LIMIT=125000

          cat /tmp/section-docker-images.md /tmp/section-compatibility.md \
              /tmp/section-migration-diff.md /tmp/section-config-diffs.md \
              /tmp/filtered-pr-list.md \
              > /tmp/full-release-notes.md

          FINAL_SIZE=$(wc -c < /tmp/full-release-notes.md)
          echo "Assembled body size: $FINAL_SIZE"

          if [ "$FINAL_SIZE" -lt "$HARD_LIMIT" ]; then
            cp /tmp/full-release-notes.md /tmp/assembled-body.md
            echo "trimmed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Body exceeds GitHub's release notes size limit -- truncating."
            MARKER=$'\n\n---\n**Truncated: this release exceeds the GitHub release notes size limit. Download full-release-notes.md attached to this release and curate the notes manually.**'
            MARKER_LEN=$(LC_ALL=C; echo -n "$MARKER" | wc -c)
            KEEP=$((HARD_LIMIT - MARKER_LEN - 100))
            head -c "$KEEP" /tmp/full-release-notes.md > /tmp/assembled-body-truncated.md

            iconv -f UTF-8 -t UTF-8 -c /tmp/assembled-body-truncated.md \
              > /tmp/assembled-body-truncated-utf8.md 2>/dev/null || true
            if [ -s /tmp/assembled-body-truncated-utf8.md ]; then
              mv /tmp/assembled-body-truncated-utf8.md /tmp/assembled-body-truncated.md
            else
              rm -f /tmp/assembled-body-truncated-utf8.md
            fi

            printf '%s' "$MARKER" >> /tmp/assembled-body-truncated.md
            mv /tmp/assembled-body-truncated.md /tmp/assembled-body.md
            echo "trimmed=true" >> "$GITHUB_OUTPUT"
          fi

          if [ ! -s /tmp/assembled-body.md ]; then
            echo "::error::assembled-body.md is empty -- refusing to proceed with an empty release body"
            exit 1
          fi

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ steps.generate_app_token.outputs.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"

          if gh release view "$NEXT_TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::A release already exists for tag $NEXT_TAG -- delete or publish it first, or this is an unintended re-run"
            exit 1
          fi

          ARGS=(--draft --title "$NEXT_TAG" --notes-file /tmp/assembled-body.md --repo "$REPO" "$NEXT_TAG")
          if [ "${{ steps.assemble.outputs.trimmed }}" = "true" ]; then
            ARGS+=(/tmp/full-release-notes.md)
          fi

          if ! CREATE_ERR=$(gh release create "${ARGS[@]}" 2>&1); then
            echo "$CREATE_ERR"
            echo "::error::gh release create failed for tag $NEXT_TAG: $(echo "$CREATE_ERR" | tail -1)"
            exit 1
          fi

          echo "$CREATE_ERR"

          RELEASE_URL=$(gh release view "$NEXT_TAG" --repo "$REPO" --json url -q .url)
          {
            echo "### Draft release created"
            echo ""
            echo "[$NEXT_TAG]($RELEASE_URL) -- review and publish manually."
          } >> "$GITHUB_STEP_SUMMARY"
