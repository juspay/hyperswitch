name: CI-pr

permissions:
  contents: read

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Disable incremental compilation.
  #
  # Incremental compilation is useful as part of an edit-build-test-edit cycle,
  # as it lets the compiler avoid recompiling code that hasn't changed. However,
  # on CI, we're not making small edits; we're almost always building the entire
  # project from scratch. Thus, incremental compilation on CI actually
  # introduces *additional* overhead to support making future builds
  # faster...but no future builds will ever occur in any given CI environment.
  #
  # See https://matklad.github.io/2021/09/04/fast-rust-builds.html#ci-workflow
  # for details.
  CARGO_INCREMENTAL: 0
  # Allow more retries for network requests in cargo (downloading crates) and
  # rustup (installing toolchains). This should help to reduce flaky CI failures
  # from transient network timeouts or other issues.
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  # Don't emit giant backtraces in the CI logs.
  RUST_BACKTRACE: short

jobs:
  formatting:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - name: Generate a token
        if: ${{ github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.HYPERSWITCH_BOT_APP_ID }}
          private-key: ${{ secrets.HYPERSWITCH_BOT_APP_PRIVATE_KEY }}

      - name: Checkout repository with token
        if: ${{ github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.generate_token.outputs.token }}

      - name: Checkout repository for fork
        if: ${{ github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name }}
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt

      - name: Check formatting for forked pull requests
        if: ${{ github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name }}
        shell: bash
        run: cargo +nightly fmt --all --check

      - name: Run formatter
        if: ${{ github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
        shell: bash
        run: |
          cargo +nightly fmt --all
          if ! git diff --exit-code --quiet -- crates; then
            echo "::notice::Formatting check failed"
            git config --local user.name 'hyperswitch-bot[bot]'
            git config --local user.email '148525504+hyperswitch-bot[bot]@users.noreply.github.com'
            git add crates
            git commit --message 'chore: run formatter'
            git push
          fi

  check-msrv:
    name: Check compilation on MSRV toolchain
    runs-on: ${{ matrix.runner }}
    if: ${{ ! startsWith(github.event.pull_request.base.ref, 'hotfix-') }}

    env:
      RUSTFLAGS: "-D warnings"

    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mold linker
        uses: rui314/setup-mold@v1
        if: ${{ runner.os == 'Linux' }}
        with:
          make-default: true

      - name: Get rust version from Cargo.toml
        shell: bash
        run: |
          rust_version=$(yq -oy '.workspace.package.rust-version' Cargo.toml)
          echo "rust_version=${rust_version}" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "${{ env.rust_version }}"

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install rust cache
        uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: msrv
          # TEMPORARY - REVERT BEFORE MERGE.
          # Lets this PR populate and then restore its own check-msrv cache
          # to get a real cold-vs-warm comparison without waiting for a
          # merge to main. Guarded to this branch name so it's inert
          # everywhere else.
          save-if: ${{ github.head_ref == 'ci/sccache-migration' }}

      - name: Run cargo check
        shell: bash
        run: cargo check --features "release"

  test:
    name: Run tests on stable toolchain
    runs-on: hyperswitch-runners

    env:
      # Use `sccache` for caching compilation artifacts, via its native S3
      # backend (SCCACHE_BUCKET/SCCACHE_REGION/SCCACHE_S3_KEY_PREFIX/
      # SCCACHE_S3_SERVER_SIDE_ENCRYPTION come from this pod's own
      # environment, managed outside this repo).
      RUSTC_WRAPPER: sccache
      # RUSTC_WRAPPER alone doesn't cover `cargo clippy`: clippy sets
      # RUSTC_WORKSPACE_WRAPPER=clippy-driver for workspace crates, which
      # takes precedence over RUSTC_WRAPPER for those crates specifically,
      # so without this, sccache never even sees the workspace-crate lint
      # invocations `just clippy`/`just clippy_v2` below produce. sccache
      # has recognized clippy-driver as a cacheable compiler since 2020
      # (mozilla/sccache#728) — this just points that mechanism at it too.
      RUSTC_WORKSPACE_WRAPPER: sccache
      RUSTFLAGS: "-D warnings"
      # This job runs on fork PRs too (see the fork checkout step below), so
      # keep it read-only — matches the old rust-cache `save-if: false`
      # policy — so a fork PR can't write into the shared production cache.
      # Only CI-push.yml's `push` build writes.
      #
      # TEMPORARY - REVERT BEFORE MERGE.
      # Flipped to read-write, guarded to this branch name only, so this PR
      # can populate and then restore its own cache — specifically to
      # measure the RUSTC_WORKSPACE_WRAPPER=sccache clippy-caching change
      # above — without waiting for a merge to main. Inert on every other
      # PR (including forks).
      SCCACHE_S3_RW_MODE: ${{ github.head_ref == 'ci/sccache-migration' && 'READ_WRITE' || 'READ_ONLY' }}

    steps:
      - name: Mask S3 cache location in job logs
        shell: bash
        run: |
          # Not secrets (auth is via IAM role), but no reason to publish the
          # bucket layout in a public repo's PR logs — including logs from
          # fork PRs. sccache's own `--show-stats` output prints these back
          # verbatim, so mask before anything can echo them.
          [ -n "${SCCACHE_BUCKET:-}" ] && echo "::add-mask::${SCCACHE_BUCKET}"
          [ -n "${SCCACHE_REGION:-}" ] && echo "::add-mask::${SCCACHE_REGION}"
          [ -n "${SCCACHE_S3_KEY_PREFIX:-}" ] && echo "::add-mask::${SCCACHE_S3_KEY_PREFIX}"

      - name: Generate a token
        if: ${{ github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.HYPERSWITCH_BOT_APP_ID }}
          private-key: ${{ secrets.HYPERSWITCH_BOT_APP_PRIVATE_KEY }}

      - name: Checkout repository for fork
        if: ${{ (github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name) }}
        uses: actions/checkout@v7

      - name: Checkout repository with token
        if: ${{ (github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name) }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.generate_token.outputs.token }}

      - name: Install mold linker
        uses: rui314/setup-mold@v1
        if: ${{ runner.os == 'Linux' }}
        with:
          make-default: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable 2 weeks ago
          components: clippy

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install sccache
        uses: taiki-e/install-action@v2
        with:
          tool: sccache
          checksum: true

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
          checksum: true

      - name: Run clippy (redis-rs backend)
        shell: bash
        run: just clippy

      - name: Run clippy (fred backend)
        shell: bash
        run: just clippy fred

      - name: Check Cargo.lock changed
        if: ${{ (github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name) }}
        shell: bash
        run: |
          if ! git diff --quiet --exit-code -- Cargo.lock ; then
            git config --local user.name 'hyperswitch-bot[bot]'
            git config --local user.email '148525504+hyperswitch-bot[bot]@users.noreply.github.com'
            git add Cargo.lock
            git commit --message 'chore: update Cargo.lock'
            git push
          fi

      - name: Run cargo check
        shell: bash
        run: cargo check --features "release"

      - name: Show sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats

  typos:
    name: Spell check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Spell check
        uses: crate-ci/typos@master

  typos-required:
    name: Spell check specific critical directories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Spell check specific directories
        uses: crate-ci/typos@v1.48.0
        with:
          files: |
            api-reference/
            crates/api_models/
            crates/common_utils/
            crates/common_enums/
            crates/diesel_models/
            migrations/
            v2_migrations/
            v2_compatible_migrations/
            config/
            docs/

  check-v2:
    name: Check compilation for V2 features
    runs-on: hyperswitch-runners

    env:
      # Use `sccache` for caching compilation artifacts, via its native S3
      # backend (bucket/region/prefix/encryption come from this pod's own
      # environment). Read-only — same fork-PR reasoning as the `test` job.
      RUSTC_WRAPPER: sccache
      # See `test`: covers `cargo clippy`'s workspace-crate invocations,
      # which RUSTC_WRAPPER alone doesn't reach.
      RUSTC_WORKSPACE_WRAPPER: sccache
      # TEMPORARY - REVERT BEFORE MERGE. See `test` for why.
      SCCACHE_S3_RW_MODE: ${{ github.head_ref == 'ci/sccache-migration' && 'READ_WRITE' || 'READ_ONLY' }}

    steps:
      - name: Mask S3 cache location in job logs
        shell: bash
        run: |
          [ -n "${SCCACHE_BUCKET:-}" ] && echo "::add-mask::${SCCACHE_BUCKET}"
          [ -n "${SCCACHE_REGION:-}" ] && echo "::add-mask::${SCCACHE_REGION}"
          [ -n "${SCCACHE_S3_KEY_PREFIX:-}" ] && echo "::add-mask::${SCCACHE_S3_KEY_PREFIX}"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mold linker
        uses: rui314/setup-mold@v1
        if: ${{ runner.os == 'Linux' }}
        with:
          make-default: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable 2 weeks ago
          components: clippy

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install sccache
        uses: taiki-e/install-action@v2
        with:
          tool: sccache
          checksum: true

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
          checksum: true

      - name: Run cargo clippy with v2 features enabled (redis-rs backend)
        shell: bash
        run: just clippy_v2

      - name: Run cargo clippy with v2 features enabled (fred backend)
        shell: bash
        run: just clippy_v2 fred

      - name: Run cargo check enabling only the release and v2 features (redis-rs backend)
        shell: bash
        env:
          RUSTFLAGS: "-A warnings"
        run: cargo check --no-default-features --features "release,v2,redis-rs"

      - name: Run cargo check enabling only the release and v2 features (fred backend)
        shell: bash
        env:
          RUSTFLAGS: "-A warnings"
        run: cargo check --no-default-features --features "release,v2,fred"

      - name: Show sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats
