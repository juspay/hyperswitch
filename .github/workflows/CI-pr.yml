name: CI-pr

permissions:
  contents: read

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Disable incremental compilation.
  #
  # Incremental compilation is useful as part of an edit-build-test-edit cycle,
  # as it lets the compiler avoid recompiling code that hasn't changed. However,
  # on CI, we're not making small edits; we're almost always building the entire
  # project from scratch. Thus, incremental compilation on CI actually
  # introduces *additional* overhead to support making future builds
  # faster...but no future builds will ever occur in any given CI environment.
  #
  # See https://matklad.github.io/2021/09/04/fast-rust-builds.html#ci-workflow
  # for details.
  CARGO_INCREMENTAL: 0
  # Allow more retries for network requests in cargo (downloading crates) and
  # rustup (installing toolchains). This should help to reduce flaky CI failures
  # from transient network timeouts or other issues.
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  # Don't emit giant backtraces in the CI logs.
  RUST_BACKTRACE: short

jobs:
  formatting:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - name: Generate a token
        if: ${{ github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.HYPERSWITCH_BOT_APP_ID }}
          private-key: ${{ secrets.HYPERSWITCH_BOT_APP_PRIVATE_KEY }}

      - name: Checkout repository with token
        if: ${{ github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.generate_token.outputs.token }}

      - name: Checkout repository for fork
        if: ${{ github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name }}
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt

      - name: Check formatting for forked pull requests
        if: ${{ github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name }}
        shell: bash
        run: cargo +nightly fmt --all --check

      - name: Run formatter
        if: ${{ github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
        shell: bash
        run: |
          cargo +nightly fmt --all
          if ! git diff --exit-code --quiet -- crates; then
            echo "::notice::Formatting check failed"
            git config --local user.name 'hyperswitch-bot[bot]'
            git config --local user.email '148525504+hyperswitch-bot[bot]@users.noreply.github.com'
            git add crates
            git commit --message 'chore: run formatter'
            git push
          fi

  check-msrv:
    name: Check compilation on MSRV toolchain
    runs-on: ${{ matrix.runner }}
    if: ${{ ! startsWith(github.event.pull_request.base.ref, 'hotfix-') }}

    env:
      # sccache on local disk via actions/cache, not SCCACHE_GHA_ENABLED
      # (proven slower here before — see git log for check-msrv).
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: "2G"
      RUSTFLAGS: "-D warnings"

    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mold linker
        uses: rui314/setup-mold@v1
        if: ${{ runner.os == 'Linux' }}
        with:
          make-default: true

      - name: Get rust version from Cargo.toml
        shell: bash
        run: |
          rust_version=$(yq -oy '.workspace.package.rust-version' Cargo.toml)
          echo "rust_version=${rust_version}" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "${{ env.rust_version }}"

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install sccache
        uses: taiki-e/install-action@v2
        with:
          tool: sccache
          checksum: true

      - name: Restore sccache cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-local-check-msrv-${{ runner.os }}-${{ runner.arch }}

      - name: Run cargo check
        shell: bash
        run: cargo check --features "release"

      - name: Show sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats

  test:
    name: Run tests on stable toolchain
    runs-on: hyperswitch-runners

    env:
      # sccache on local disk, restored as one archive instead of its native
      # S3 backend — avoids per-object request round trips under load.
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: "4G"
      SCCACHE_IDLE_TIMEOUT: "0"
      RUSTFLAGS: "-D warnings"

    steps:
      - name: Mask S3 cache location in job logs
        shell: bash
        run: |
          # Not secret, but no reason to publish the bucket layout in
          # public PR logs (sccache --show-stats echoes it back).
          [ -n "${SCCACHE_BUCKET:-}" ] && echo "::add-mask::${SCCACHE_BUCKET}"
          [ -n "${SCCACHE_REGION:-}" ] && echo "::add-mask::${SCCACHE_REGION}"
          [ -n "${SCCACHE_S3_KEY_PREFIX:-}" ] && echo "::add-mask::${SCCACHE_S3_KEY_PREFIX}"

      - name: Generate a token
        if: ${{ github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.HYPERSWITCH_BOT_APP_ID }}
          private-key: ${{ secrets.HYPERSWITCH_BOT_APP_PRIVATE_KEY }}

      - name: Checkout repository for fork
        if: ${{ (github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name) }}
        uses: actions/checkout@v7

      - name: Checkout repository with token
        if: ${{ (github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name) }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.generate_token.outputs.token }}

      - name: Install mold linker
        uses: rui314/setup-mold@v1
        if: ${{ runner.os == 'Linux' }}
        with:
          make-default: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable 2 weeks ago
          components: clippy

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install sccache
        uses: taiki-e/install-action@v2
        with:
          tool: sccache
          checksum: true

      - name: Resolve S3 cache location, then disable sccache's native S3 backend
        shell: bash
        run: |
          echo "S3_CACHE_BUCKET=${SCCACHE_BUCKET:-}" >> "$GITHUB_ENV"
          echo "S3_CACHE_REGION=${SCCACHE_REGION:-}" >> "$GITHUB_ENV"
          echo "S3_CACHE_PREFIX=${SCCACHE_S3_KEY_PREFIX:-}" >> "$GITHUB_ENV"
          echo "SCCACHE_BUCKET=" >> "$GITHUB_ENV"
          echo "SCCACHE_REGION=" >> "$GITHUB_ENV"
          echo "SCCACHE_S3_KEY_PREFIX=" >> "$GITHUB_ENV"

      # Streamed straight from S3 into tar (no intermediate .tar.gz on disk).
      - name: Restore sccache cache from S3
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$SCCACHE_DIR"
          if [ -n "$S3_CACHE_BUCKET" ]; then
            aws s3 cp \
              "s3://${S3_CACHE_BUCKET}/${S3_CACHE_PREFIX}sccache-cache/test-${{ runner.os }}-${{ runner.arch }}.tar.gz" \
              - \
              --region "${S3_CACHE_REGION}" --no-progress --only-show-errors \
              | tar xzf - -C "$SCCACHE_DIR"
          else
            echo "::warning::S3 cache bucket not configured on this runner; sccache starts cold"
          fi

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
          checksum: true

      - name: Run clippy (redis-rs backend)
        shell: bash
        # Capped: uncapped + cold cache OOM'd a runner pod (git log).
        env:
          CARGO_BUILD_JOBS: 6
        run: just clippy

      - name: Run clippy (fred backend)
        shell: bash
        env:
          CARGO_BUILD_JOBS: 6
        run: just clippy fred

      - name: Check Cargo.lock changed
        if: ${{ (github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name) }}
        shell: bash
        run: |
          if ! git diff --quiet --exit-code -- Cargo.lock ; then
            git config --local user.name 'hyperswitch-bot[bot]'
            git config --local user.email '148525504+hyperswitch-bot[bot]@users.noreply.github.com'
            git add Cargo.lock
            git commit --message 'chore: update Cargo.lock'
            git push
          fi

      - name: Run cargo check
        shell: bash
        env:
          CARGO_BUILD_JOBS: 6
        run: cargo check --features "release"

      - name: Show sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats

  typos:
    name: Spell check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Spell check
        uses: crate-ci/typos@master

  typos-required:
    name: Spell check specific critical directories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Spell check specific directories
        uses: crate-ci/typos@v1.48.0
        with:
          files: |
            api-reference/
            crates/api_models/
            crates/common_utils/
            crates/common_enums/
            crates/diesel_models/
            migrations/
            v2_migrations/
            v2_compatible_migrations/
            config/
            docs/

  check-v2:
    name: Check compilation for V2 features
    runs-on: hyperswitch-runners

    env:
      # sccache on local disk, restored as a single compressed archive —
      # see `test` for why.
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: "4G"
      SCCACHE_IDLE_TIMEOUT: "0"

    steps:
      - name: Mask S3 cache location in job logs
        shell: bash
        run: |
          [ -n "${SCCACHE_BUCKET:-}" ] && echo "::add-mask::${SCCACHE_BUCKET}"
          [ -n "${SCCACHE_REGION:-}" ] && echo "::add-mask::${SCCACHE_REGION}"
          [ -n "${SCCACHE_S3_KEY_PREFIX:-}" ] && echo "::add-mask::${SCCACHE_S3_KEY_PREFIX}"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mold linker
        uses: rui314/setup-mold@v1
        if: ${{ runner.os == 'Linux' }}
        with:
          make-default: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable 2 weeks ago
          components: clippy

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install sccache
        uses: taiki-e/install-action@v2
        with:
          tool: sccache
          checksum: true

      - name: Resolve S3 cache location, then disable sccache's native S3 backend
        shell: bash
        run: |
          echo "S3_CACHE_BUCKET=${SCCACHE_BUCKET:-}" >> "$GITHUB_ENV"
          echo "S3_CACHE_REGION=${SCCACHE_REGION:-}" >> "$GITHUB_ENV"
          echo "S3_CACHE_PREFIX=${SCCACHE_S3_KEY_PREFIX:-}" >> "$GITHUB_ENV"
          echo "SCCACHE_BUCKET=" >> "$GITHUB_ENV"
          echo "SCCACHE_REGION=" >> "$GITHUB_ENV"
          echo "SCCACHE_S3_KEY_PREFIX=" >> "$GITHUB_ENV"

      - name: Restore sccache cache from S3
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$SCCACHE_DIR"
          if [ -n "$S3_CACHE_BUCKET" ]; then
            aws s3 cp \
              "s3://${S3_CACHE_BUCKET}/${S3_CACHE_PREFIX}sccache-cache/check-v2-${{ runner.os }}-${{ runner.arch }}.tar.gz" \
              - \
              --region "${S3_CACHE_REGION}" --no-progress --only-show-errors \
              | tar xzf - -C "$SCCACHE_DIR"
          else
            echo "::warning::S3 cache bucket not configured on this runner; sccache starts cold"
          fi

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
          checksum: true

      - name: Run cargo clippy with v2 features enabled (redis-rs backend)
        shell: bash
        env:
          CARGO_BUILD_JOBS: 6
        run: just clippy_v2

      - name: Run cargo clippy with v2 features enabled (fred backend)
        shell: bash
        env:
          CARGO_BUILD_JOBS: 6
        run: just clippy_v2 fred

      - name: Run cargo check enabling only the release and v2 features (redis-rs backend)
        shell: bash
        env:
          RUSTFLAGS: "-A warnings"
          CARGO_BUILD_JOBS: 6
        run: cargo check --no-default-features --features "release,v2,redis-rs"

      - name: Run cargo check enabling only the release and v2 features (fred backend)
        shell: bash
        env:
          RUSTFLAGS: "-A warnings"
          CARGO_BUILD_JOBS: 6
        run: cargo check --no-default-features --features "release,v2,fred"

      - name: Show sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats
