name: CI-pr

permissions:
  contents: read

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Disable incremental compilation: CI builds from scratch, so it only adds
  # overhead. See https://matklad.github.io/2021/09/04/fast-rust-builds.html#ci-workflow
  CARGO_INCREMENTAL: 0
  # More retries for cargo/rustup network requests to reduce flaky CI failures.
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  # Don't emit giant backtraces in the CI logs.
  RUST_BACKTRACE: short

jobs:
  formatting:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - name: Generate a token
        if: ${{ github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.HYPERSWITCH_BOT_APP_ID }}
          private-key: ${{ secrets.HYPERSWITCH_BOT_APP_PRIVATE_KEY }}

      - name: Checkout repository with token
        if: ${{ github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.generate_token.outputs.token }}

      - name: Checkout repository for fork
        if: ${{ github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name }}
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt

      - name: Check formatting for forked pull requests
        if: ${{ github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name }}
        shell: bash
        run: cargo +nightly fmt --all --check

      - name: Run formatter
        if: ${{ github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
        shell: bash
        run: |
          cargo +nightly fmt --all
          if ! git diff --exit-code --quiet -- crates; then
            echo "::notice::Formatting check failed"
            git config --local user.name 'hyperswitch-bot[bot]'
            git config --local user.email '148525504+hyperswitch-bot[bot]@users.noreply.github.com'
            git add crates
            git commit --message 'chore: run formatter'
            git push
          fi

  check-msrv:
    name: Check compilation on MSRV toolchain
    runs-on: ${{ matrix.runner }}
    if: ${{ ! startsWith(github.event.pull_request.base.ref, 'hotfix-') }}

    env:
      # sccache on local disk via actions/cache, not SCCACHE_GHA_ENABLED (slower here; see git log).
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: "2G"
      SCCACHE_IDLE_TIMEOUT: "0"
      RUSTFLAGS: "-D warnings"

    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mold linker
        uses: rui314/setup-mold@v1
        if: ${{ runner.os == 'Linux' }}
        with:
          make-default: true

      - name: Get rust version from Cargo.toml
        shell: bash
        run: |
          rust_version=$(yq -oy '.workspace.package.rust-version' Cargo.toml)
          echo "rust_version=${rust_version}" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "${{ env.rust_version }}"

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install sccache
        uses: taiki-e/install-action@v2
        with:
          tool: sccache
          checksum: true

      - name: Restore sccache cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-local-check-msrv-${{ runner.os }}-${{ runner.arch }}

      - name: Run cargo check
        shell: bash
        run: cargo check --features "release"

      - name: Show sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats

  test:
    name: Run tests on stable toolchain
    runs-on: hyperswitch-runners

    env:
      # sccache restored as one archive instead of S3 — avoids per-object round trips.
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: "1536M"
      SCCACHE_IDLE_TIMEOUT: "0"
      RUSTFLAGS: "-D warnings"

    steps:
      - name: Generate a token
        if: ${{ github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.HYPERSWITCH_BOT_APP_ID }}
          private-key: ${{ secrets.HYPERSWITCH_BOT_APP_PRIVATE_KEY }}

      - name: Checkout repository for fork
        if: ${{ (github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name) }}
        uses: actions/checkout@v7

      - name: Checkout repository with token
        if: ${{ (github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name) }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.generate_token.outputs.token }}

      - name: Install mold linker
        uses: rui314/setup-mold@v1
        if: ${{ runner.os == 'Linux' }}
        with:
          make-default: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable 2 weeks ago
          components: clippy

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mask S3 cache location in job logs
        shell: bash
        run: .github/scripts/sccache-mask-s3-env.sh

      - name: Install sccache
        uses: taiki-e/install-action@v2
        with:
          tool: sccache
          checksum: true

      # PRs changing third-party crates get their own cache key; others share. See the script.
      - name: Decide the sccache scope for this PR
        id: cache_scope
        shell: bash
        run: |
          .github/scripts/sccache-cache-scope.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.number }}" \
            "${{ github.event.pull_request.head.repo.full_name == github.repository }}"

      - name: Restore sccache cache from S3
        continue-on-error: true
        shell: bash
        run: .github/scripts/sccache-restore-s3.sh test "${{ steps.cache_scope.outputs.scope }}"

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
          checksum: true

      - name: Run clippy (redis-rs backend)
        shell: bash
        # Capped: uncapped + cold cache OOM'd a runner pod (git log).
        env:
          CARGO_BUILD_JOBS: 9
        run: just clippy

      - name: Run clippy (fred backend)
        shell: bash
        env:
          CARGO_BUILD_JOBS: 9
        run: just clippy fred

      - name: Check Cargo.lock changed
        if: ${{ (github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name) }}
        shell: bash
        run: |
          if ! git diff --quiet --exit-code -- Cargo.lock ; then
            git config --local user.name 'hyperswitch-bot[bot]'
            git config --local user.email '148525504+hyperswitch-bot[bot]@users.noreply.github.com'
            git add Cargo.lock
            git commit --message 'chore: update Cargo.lock'
            git push
          fi

      - name: Show sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats

      # Only for PRs that changed Cargo.lock (see the scope step). Writes a PR-scoped
      # key, never clobbering the shared cache. `!cancelled()`: cache on failure, skip on cancel.
      - name: Save sccache cache to S3
        if: ${{ !cancelled() && steps.cache_scope.outputs.scope != '' }}
        continue-on-error: true
        shell: bash
        run: .github/scripts/sccache-save-s3.sh test "${{ steps.cache_scope.outputs.scope }}"

  typos:
    name: Spell check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Spell check
        uses: crate-ci/typos@master

  typos-required:
    name: Spell check specific critical directories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Spell check specific directories
        uses: crate-ci/typos@v1.48.0
        with:
          files: |
            api-reference/
            crates/api_models/
            crates/common_utils/
            crates/common_enums/
            crates/diesel_models/
            migrations/
            v2_migrations/
            v2_compatible_migrations/
            config/
            docs/

  check-v2:
    name: Check compilation for V2 features
    runs-on: hyperswitch-runners

    env:
      # sccache restored as a single archive — see `test` for why.
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: "1536M"
      SCCACHE_IDLE_TIMEOUT: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mold linker
        uses: rui314/setup-mold@v1
        if: ${{ runner.os == 'Linux' }}
        with:
          make-default: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable 2 weeks ago
          components: clippy

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mask S3 cache location in job logs
        shell: bash
        run: .github/scripts/sccache-mask-s3-env.sh

      - name: Install sccache
        uses: taiki-e/install-action@v2
        with:
          tool: sccache
          checksum: true

      # PRs changing third-party crates get their own cache key; others share. See the script.
      - name: Decide the sccache scope for this PR
        id: cache_scope
        shell: bash
        run: |
          .github/scripts/sccache-cache-scope.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.number }}" \
            "${{ github.event.pull_request.head.repo.full_name == github.repository }}"

      - name: Restore sccache cache from S3
        continue-on-error: true
        shell: bash
        run: .github/scripts/sccache-restore-s3.sh check-v2 "${{ steps.cache_scope.outputs.scope }}"

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
          checksum: true

      - name: Run cargo clippy with v2 features enabled (redis-rs backend)
        shell: bash
        env:
          CARGO_BUILD_JOBS: 9
        run: just clippy_v2

      - name: Run cargo clippy with v2 features enabled (fred backend)
        shell: bash
        env:
          CARGO_BUILD_JOBS: 9
        run: just clippy_v2 fred

      - name: Show sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats

      # Only for PRs that changed Cargo.lock (see the scope step). Writes a PR-scoped
      # key, never clobbering the shared cache. `!cancelled()`: cache on failure, skip on cancel.
      - name: Save sccache cache to S3
        if: ${{ !cancelled() && steps.cache_scope.outputs.scope != '' }}
        continue-on-error: true
        shell: bash
        run: .github/scripts/sccache-save-s3.sh check-v2 "${{ steps.cache_scope.outputs.scope }}"
