name: CI wasm-check

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm-ci:
    name: Check wasm build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # actions/cache keys are immutable; needed for `gh cache delete`.
      actions: write

    env:
      # sccache on local disk via actions/cache, not SCCACHE_GHA_ENABLED —
      # see check-msrv in CI-push.yml for why.
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: "2G"
      SCCACHE_IDLE_TIMEOUT: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable 2 weeks ago

      - name: Install sccache
        uses: taiki-e/install-action@v2
        with:
          tool: sccache
          checksum: true

      - name: Restore sccache cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-local-wasm-${{ runner.os }}-${{ runner.arch }}

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
          checksum: true

      - name: wasm build
        shell: bash
        run: make euclid-wasm

      - name: payment-link wasm build
        shell: bash
        run: make payment-link-wasm

      - name: Show sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats

      - name: Delete stale sccache cache entry
        if: ${{ always() && github.event_name == 'push' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh cache delete "sccache-local-wasm-${{ runner.os }}-${{ runner.arch }}" --repo "${{ github.repository }}"

      - name: Save sccache cache
        if: ${{ always() && github.event_name == 'push' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-local-wasm-${{ runner.os }}-${{ runner.arch }}
