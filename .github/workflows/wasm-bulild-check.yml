name: CI wasm-check

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm-ci:
    name: Check wasm build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable 2 weeks ago

      - name: Install rust cache
        uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: wasm
          # TEMPORARY - REVERT BEFORE MERGE.
          # Flipped to also save on this branch's PR runs, so this PR can
          # populate and then restore its own wasm cache to get a real
          # cold-vs-warm comparison without waiting for a merge to main.
          # Guarded to this branch name so it's inert everywhere else.
          save-if: ${{ github.event_name == 'push' || github.head_ref == 'ci/sccache-migration' }}

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
          checksum: true

      - name: wasm build
        shell: bash
        run: make euclid-wasm

      - name: payment-link wasm build
        shell: bash
        run: make payment-link-wasm
