name: CI wasm-check

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm-ci:
    name: Check wasm build
    runs-on: hyperswitch-runners

    env:
      # sccache restored as one archive instead of S3 — avoids per-object round trips.
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: "2G"
      SCCACHE_IDLE_TIMEOUT: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable 2 weeks ago

      - name: Mask S3 cache location in job logs
        shell: bash
        run: .github/scripts/sccache-mask-s3-env.sh

      - name: Install sccache
        uses: taiki-e/install-action@v2
        with:
          tool: sccache
          checksum: true

      - name: Restore sccache cache from S3
        continue-on-error: true
        shell: bash
        run: .github/scripts/sccache-restore-s3.sh wasm

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
          checksum: true

      - name: wasm build
        shell: bash
        run: make euclid-wasm

      - name: payment-link wasm build
        shell: bash
        run: make payment-link-wasm

      - name: Show sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats

      # TEMPORARY: force this run to populate the shared "wasm" S3 cache,
      # since no cache has ever been saved under that key. Revert once this PR
      # has run and the cache is warm — normal behaviour is restored below.
      - name: Save sccache cache to S3
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: .github/scripts/sccache-save-s3.sh wasm
