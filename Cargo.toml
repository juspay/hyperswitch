[workspace]
resolver = "2"
members = ["crates/*"]
package.edition = "2021"
package.rust-version = "1.92.0"
package.license = "Apache-2.0"

[workspace.dependencies]
tracing = { version = "0.1.41" }

# Patched at the workspace level, not via per-crate `git` deps, because
# deja-diesel (pulled in by the `deja` feature) also depends on
# `async-bb8-diesel = "0.3.0"` from crates.io. A per-crate git dep would leave
# two distinct copies of the crate in the build graph - different Rust types
# despite an identical version and `T` - and break wherever deja-diesel and
# our own storage code meet (e.g. `diesel_models::query::generics`).
[patch.crates-io]
async-bb8-diesel = { git = "https://github.com/sai-harsha-vardhan/async-bb8-diesel", rev = "96e9895fb314f6af94897410f5fe30f9d2e18d4c" }

# Most of the lint configuration is based on https://github.com/EmbarkStudios/rust-ecosystem/blob/main/lints.toml
[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 } # Remove priority once https://github.com/rust-lang/rust-clippy/pull/12827 is available in stable clippy
unused_qualifications = "warn"
# missing_debug_implementations = "warn"
# missing_docs = "warn"

[workspace.lints.clippy]
as_conversions = "warn"
cloned_instead_of_copied = "warn"
dbg_macro = "warn"
expect_used = "warn"
fn_params_excessive_bools = "warn"
index_refutable_slice = "warn"
indexing_slicing = "warn"
large_futures = "warn"
missing_panics_doc = "warn"
mod_module_files = "warn"
out_of_bounds_indexing = "warn"
panic = "warn"
panic_in_result_fn = "warn"
panicking_unwrap = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
trivially_copy_pass_by_ref = "warn"
unimplemented = "warn"
unnecessary_self_imports = "warn"
unreachable = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"
use_self = "warn"
wildcard_dependencies = "warn"

# Lints to allow
option_map_unit_fn = "allow"

[profile.release]
strip = true
lto = true
codegen-units = 1

# Development-cycle build: optimized but without LTO, with parallel codegen and
# symbols kept. Selected via the Dockerfile's CARGO_BUILD_PROFILE build arg;
# never the default.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
strip = "none"
