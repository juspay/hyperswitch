[workspace]
resolver = "2"
members = ["crates/*"]
package.edition = "2021"
package.rust-version = "1.85.0"
package.license = "Apache-2.0"

[workspace.dependencies]
tracing = { version = "0.1.41" }

# Most of the lint configuration is based on https://github.com/EmbarkStudios/rust-ecosystem/blob/main/lints.toml
[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 } # Remove priority once https://github.com/rust-lang/rust-clippy/pull/12827 is available in stable clippy
unused_qualifications = "warn"
# missing_debug_implementations = "warn"
# missing_docs = "warn"

[workspace.lints.clippy]
as_conversions = "warn"
cloned_instead_of_copied = "warn"
dbg_macro = "warn"
expect_used = "warn"
fn_params_excessive_bools = "warn"
index_refutable_slice = "warn"
indexing_slicing = "warn"
large_futures = "warn"
missing_panics_doc = "warn"
mod_module_files = "warn"
out_of_bounds_indexing = "warn"
panic = "warn"
panic_in_result_fn = "warn"
panicking_unwrap = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
trivially_copy_pass_by_ref = "warn"
unimplemented = "warn"
unnecessary_self_imports = "warn"
unreachable = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"
use_self = "warn"
wildcard_dependencies = "warn"

# Lints to allow
option_map_unit_fn = "allow"

[profile.release]
strip = true
lto = true
codegen-units = 1

# Development-cycle build: optimized but without LTO, with parallel codegen and
# symbols kept. Selected via the Dockerfile's CARGO_BUILD_PROFILE build arg;
# never the default.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
strip = "none"

# PROOF-OF-CONCEPT ONLY — remove once
# https://github.com/juspay/hyperswitch-prism/pull/2388 merges and every
# `unified-connector-service-*` dependency below is bumped to the tag that
# contains it, at which point this patch becomes redundant (and, if left in,
# actively wrong — it would silently keep pulling an unreviewed branch).
#
# Redirects the tagged `rust-grpc-client`/`ucs_cards` dependencies (in
# external_services, hyperswitch_interfaces, router) onto the same branch
# `unified_connector_service_library` depends on directly, so both resolve to
# the identical `grpc-api-types` commit. Without this, `UcsTransport`'s gRPC
# and library match arms would reference two different (if structurally
# identical) compilations of the same proto types and fail to unify.
[patch."https://github.com/juspay/connector-service"]
rust-grpc-client = { git = "https://github.com/juspay/connector-service", branch = "feat/rust-sdk-injectable-transport" }
ucs_cards = { git = "https://github.com/juspay/connector-service", branch = "feat/rust-sdk-injectable-transport" }
