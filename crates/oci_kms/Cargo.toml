[package]
name = "oci_kms"
description = "OCI Vault KMS crypto client: OKE Workload Identity, request signing, encrypt/decrypt and data keys"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
license.workspace = true

# Deliberately free of Hyperswitch crates (no `common_utils`, `router_env` or `error-stack`),
# so services outside this workspace can depend on it without pulling in Hyperswitch.
[dependencies]
base64 = "0.22.1"
rand = "0.8.5"
reqwest = { version = "0.12.7", default-features = false, features = ["rustls-tls"] }
rsa = { version = "0.9.8", features = ["sha2"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
thiserror = "1.0.69"
time = { version = "0.3.41", features = ["formatting", "macros"] }
tokio = { version = "1.48.0", features = ["rt", "sync", "time"] }
tracing = { workspace = true }
url = "2.5.4"
zeroize = "1.8.1"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
