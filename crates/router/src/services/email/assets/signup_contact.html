<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>Sign up for {entity_name}</title>
</head>


<body style="
      background-color: #f8f9fb; /*outer wrapper*/
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
    ">
  <div style="
        width: 100%;
        margin: auto;
        text-align: center;
        background-color: #f8f9fb; /*outer wrapper*/
      ">
    <table style="text-align: center; width: 100%">
      <tr>
        <td style="height: 6px"></td>
      </tr>
      <tr>
        <td style="text-align: center">
          <table style="
                background-color: {background_color};
                text-align: center;
                max-width: 55%;
                margin: auto;
              ">
            <tr>
              <td style="height: 20px"></td>
            </tr>
            <tr>
              <td>
                <table style="width: 100%">
                  <tr>
                    <td style="text-align: center">
                      <img src={entity_logo_url} alt={entity_name} style="
                            text-align: center;
                            height: auto;
                            width: 4rem;
                          " />
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="height: 40px"></td>
            </tr>
            <tr>
              <td style="
                    font-size: 2.02rem;
                    font-weight: 600;
                    line-height: 2.5rem;
                     color: {foreground_color};
                    min-width: 550px;
                  ">
                Sign up for {entity_name}
              </td>
            </tr>
            <tr>
              <td style="height: 10px"></td>
            </tr>
            <tr>
              <td style="
                     color: {foreground_color};
                    opacity:0.8;
                    width: 50%;
                    font-size: 1.02rem;
                    font-weight: 400;
                    line-height: 1.4rem;
                    min-width: 300px;
                  ">
                <table style="
                      width: 50%;
                      min-width: 350px;
                      text-align: center;
                      margin: auto;
                    ">
                  <tr>
                    <td>
                      The signup for {entity_name} is invite-only. To activate
                      your account please drop an email to {contact_email}
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="height: 30px"></td>
            </tr>
            <tr>
              <td style="
                     color: {foreground_color};
                    opacity:0.8;
                    width: 50%;
                    font-size: 1.02rem;
                    font-weight: 400;
                    line-height: 1.4rem;
                    min-width: 300px;
                  ">
                <table style="
                      width: 50%;
                      min-width: 500px;
                      text-align: center;
                      margin: auto;
                    ">
                  <tr>
                    <td>
                      If you didn’t request this, you can ignore this email
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="height: 70px"></td>
            </tr>
          </table>
        </td>
      </tr>
      <tr>
        <td style="height: 6px"></td>
      </tr>
    </table>
  </div>
</body>

</html>
