[package]
name = "redis_interface"
description = "A user-friendly interface to Redis"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
license.workspace = true

[features]
default = ["redis-rs"]
fred = ["dep:fred", "dep:rustls-native-certs", "deja?/fred"]
redis-rs = ["dep:redis", "deja?/redis-rs"]
multitenancy_fallback = []
deja = ["common_utils/deja", "dep:deja", "dep:serde_json"]
metrics = ["dep:router_env"]

[dependencies]
error-stack = "0.4.1"
futures = "0.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", optional = true }
thiserror = "1.0.69"
tokio = "1.48.0"
tokio-stream = { version = "0.1.17", features = ["sync"] }
tracing = { workspace = true }

# Exactly one backend must be active at compile time
redis = { version = "1.2.0", optional = true, features = [
    "tokio-comp", "cluster-async", "streams", "script", "connection-manager", "tokio-rustls-comp"
]}
fred = { version = "~9.0.3", optional = true, features = [
    "metrics", "partial-tracing", "subscriber-client", "enable-rustls-ring", "i-scripts"
]}
rustls-native-certs = { version = "0.7.3", optional = true }

# First party crates
common_utils = { version = "0.1.0", path = "../common_utils", features = ["async_ext"] }
deja = { git = "https://github.com/juspay/deja", rev = "3fe15f88537c4bf4375504de4582217ba4e2d8e0", optional = true, default-features = false, features = ["error-stack"] }
hyperswitch_masking = "0.0.1"
router_env = { version = "0.1.0", path = "../router_env", optional = true }

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
