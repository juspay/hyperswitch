# Configuration for the standalone `observability` service.
#
# Read by `cargo run -p observability`. Override the path with `-f <file>`, or move the config
# directory with the `CONFIG_DIR` environment variable.
#
# Every value here can be overridden by an environment variable prefixed `OBSERVABILITY__`, with
# `__` separating levels — `OBSERVABILITY__AUTH__INTERNAL_API_KEY` sets `auth.internal_api_key`. In
# deployed environments the key comes from the environment or from a secrets manager, never from
# this file.

[server]
host = "127.0.0.1"
port = 8085
workers = 1

[log.console]
enabled = true
level = "DEBUG"
log_format = "default"

[log.file]
enabled = false

[log.telemetry]
traces_enabled = false
metrics_enabled = false

# The key callers must supply in the `X-Internal-Api-Key` header.
#
# There is no way to disable authentication. An empty value is not "open" — the service refuses to
# start. The value below is a local development placeholder and must not reach any deployed
# environment.
[auth]
internal_api_key = "observability_dev_key"

# How the secrets above are resolved at boot. `no_encryption` takes them literally; the KMS
# variants are compiled in under the `release` feature and treat them as handles to resolve.
[secrets_management]
secrets_manager = "no_encryption"

# Outbound HTTP proxy, if the pod cannot reach chat providers directly. A deployment fact, so it
# lives here once rather than on each destination.
[proxy]

# Chat destinations, keyed by the id a request names in its `destination` field. A request carries
# no channel id and no credential — only an id from this table.
#
# Ids set from the environment arrive lowercased and cannot contain `__`, because `config`
# lowercases every environment key and splits levels on `__`. The service refuses to start on an id
# that would not survive that, rather than failing to match it at lookup time.
#
#   OBSERVABILITY__CHAT__DESTINATIONS__SR_ALERTS__TYPE=xyne
#   OBSERVABILITY__CHAT__DESTINATIONS__SR_ALERTS__APP_JWT=...
#   OBSERVABILITY__CHAT__DESTINATIONS__SR_ALERTS__CHANNEL=...
#
# `type = "log"` accepts messages and delivers nothing. It exists so the whole path — guard, route,
# registry, response — can be exercised before real credentials exist. It logs sizes, never the
# message: this writes to the same stream as everything else and an alert body carries merchant ids
# and payment volumes.
#
# Upload bodies are consumed as a stream and refused once this many field bytes have arrived.
[chat]
max_upload_bytes = 26214400 # 25 MiB

[chat.destinations.smoke]
type = "log"

# A real Xyne destination looks like this. `base_url` defaults to production and `timeout_seconds`
# and `max_message_chars` to the client's own defaults, so a channel and a credential are all that
# is required.
#
# [chat.destinations.sr_alerts]
# type = "xyne"
# app_jwt = "..."
# channel = "..."
#
# Slack is the same client with a different base URL and credential, not a second integration.
#
# [chat.destinations.escalation]
# type = "slack"
# bot_token = "xoxb-..."
# channel = "..."

# The email transport, shared by every email destination. `external_services`' own configuration,
# so the backend selection and its validation are the router's, not a second copy of them.
#
# `NO_EMAIL_CLIENT` accepts and logs. That is the off switch and the default: no separate "email
# enabled" flag exists, because a backend that sends nothing already is one. A deployment runs with
# this until SES credentials exist.
#
#   active_email_client = "SES"          and an [email.aws_ses] section
#   active_email_client = "SMTP"         and an [email.smtp] section
#
# The transport is validated at boot only when destinations exist, so a service with no email
# destinations does not need a verified sender to start.
[email]
active_email_client = "NO_EMAIL_CLIENT"
sender_email = "alerts@example.com"
aws_region = ""

# Email destinations, keyed the same way as chat.
#
# One address per destination: `EmailClient::send_email` accepts a single recipient and both
# backends build a single-recipient message, so reaching three people is three destinations today.
# Widening it is tracked separately, and when it lands this becomes a list without any caller
# changing, since a request only ever names an id.
#
# A destination with no address fails the boot rather than accepting alerts and sending them
# nowhere.
[email.destinations.smoke]
to = "alerts@example.com"

# ---------------------------------------------------------------------------------------------
# CloudWatch metric alarms.
#
# This service evaluates these against CloudWatch every time `POST /alerts/cloudwatch/evaluate` is
# called, and announces each state transition to the destination its severity maps to. An empty
# `[cloudwatch.alarms]` turns the whole thing off, and a deployment that only forwards alerts needs
# no `[cloudwatch]` section at all.
#
# **The infrastructure repository owns this catalogue.** Terraform knows the resource identifiers
# and expands the templated classifications; it renders these definitions and Helm delivers them.
# Nothing here is discovered, parsed or expanded at runtime — a definition arrives with its
# dimensions already resolved, and this service's job is to check that what arrived is usable and
# then evaluate it.
[cloudwatch]
region = "ap-south-1"

# Where a failed *evaluation* is reported. Separate from the severity destinations below, because
# "CloudWatch did not answer" is a fact about this service, not an alert about the database.
failure_destination = "smoke"

# Where these definitions came from. `temporary = true` makes the service log a warning at every
# boot, so a hand-checked snapshot announces itself for as long as it is one. The renderer that
# replaces it fills in the same three fields.
[cloudwatch.source]
origin = "hyperswitch-infra.git observability-plane/terraform/aws/live/sandbox/ap-south-1/cloudwatch-alarms/terragrunt.hcl (classification `rds-alerts`)"
revision = "2851b3d6e6dc2fb09c8bd97caf209d3470f7c273"
temporary = true

# Three severity ids, all naming one sandbox destination. Routing lives here so that splitting
# them later is a configuration change rather than a code change.
#
# `smoke` accepts messages and delivers nothing (`type = "log"` above), which is what a developer
# machine should be pointed at. A deployment overrides these with a real destination id:
#
#   OBSERVABILITY__CLOUDWATCH__SEVERITY_DESTINATIONS__SEV1=infra_alerts
[cloudwatch.severity_destinations]
sev1 = "smoke"
sev2 = "smoke"
sev3 = "smoke"

# --- The catalogue -----------------------------------------------------------------------------
#
# Twenty definitions, fifty-three severities, twenty distinct CloudWatch queries — severities of
# one definition differ only by threshold, and a threshold is not part of a query.
#
# Field names and defaults are `classified_metric_alarms`' own, so an entry can be checked against
# its source by eye. What is omitted means what the Terraform module fills in: `statistic` is
# `Average`, `comparison_operator` is `GreaterThanThreshold`, `treat_missing_data` is
# `notBreaching`, and `datapoints_to_alarm` defaults to `evaluation_periods`. Note that the
# module's missing-data default is *not* AWS's (`missing`); it is the module's value that the
# deployed alarms actually carry.
#
# Dimensions come from `dimension_map` in the same source file, resolved:
#   rds          -> DBClusterIdentifier  = hyperswitchdb-cluster  (database module output)
#   rds-primary  -> DBInstanceIdentifier = hyperswitchdb-primary  (literal)
#   rds-failover -> DBInstanceIdentifier = failover-replica-1     (literal)
#   rds-writer   -> DBClusterIdentifier + Role = WRITER
#   rds-reader   -> DBClusterIdentifier + Role = READER

[cloudwatch.alarms.rds-primary-cpu]
classification = "rds-alerts"
metric_name = "CPUUtilization"
namespace = "AWS/RDS"
period = 60
statistic = "Average"
dimensions = [{ name = "DBInstanceIdentifier", value = "hyperswitchdb-primary" }]

[cloudwatch.alarms.rds-primary-cpu.severities.sev1]
threshold = 90.0
comparison_operator = "GreaterThanOrEqualToThreshold"
evaluation_periods = 1
treat_missing_data = "breaching"
description = "SEV1: RDS primary database CPU utilization is above 90% (Sev0 limit) for 5 minutes. Immediate scaling or database resource optimization is required."

[cloudwatch.alarms.rds-primary-cpu.severities.sev2]
threshold = 85.0
comparison_operator = "GreaterThanOrEqualToThreshold"
evaluation_periods = 1
description = "SEV2: RDS primary database CPU utilization is above 85% (Critical limit) for 5 minutes. Review slow queries and active database metrics."

[cloudwatch.alarms.rds-primary-cpu.severities.sev3]
threshold = 65.0
comparison_operator = "GreaterThanOrEqualToThreshold"
evaluation_periods = 1
description = "SEV3: RDS primary database CPU utilization is above 65% (Warning limit) for 5 minutes. Monitor connection patterns and slow queries."

[cloudwatch.alarms.rds-failover-cpu]
classification = "rds-alerts"
metric_name = "CPUUtilization"
namespace = "AWS/RDS"
period = 60
statistic = "Average"
dimensions = [{ name = "DBInstanceIdentifier", value = "failover-replica-1" }]

[cloudwatch.alarms.rds-failover-cpu.severities.sev1]
threshold = 90.0
comparison_operator = "GreaterThanOrEqualToThreshold"
evaluation_periods = 1
treat_missing_data = "breaching"
description = "SEV1: RDS failover database CPU utilization is above 90% (Sev0 limit) for 5 minutes. Review replica performance."

[cloudwatch.alarms.rds-failover-cpu.severities.sev2]
threshold = 85.0
