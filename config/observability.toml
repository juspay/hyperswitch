# Configuration for the standalone `observability` service.
#
# Read by `cargo run -p observability`. Override the path with `-f <file>`, or move the config
# directory with the `CONFIG_DIR` environment variable.
#
# Every value here can be overridden by an environment variable prefixed `OBSERVABILITY__`, with
# `__` separating levels — `OBSERVABILITY__AUTH__INTERNAL_API_KEY` sets `auth.internal_api_key`. In
# deployed environments the key comes from the environment or from a secrets manager, never from
# this file.

[server]
host = "127.0.0.1"
port = 8085
workers = 1

[log.console]
enabled = true
level = "DEBUG"
log_format = "default"

[log.file]
enabled = false

[log.telemetry]
traces_enabled = false
metrics_enabled = false

# The key callers must supply in the `X-Internal-Api-Key` header.
#
# There is no way to disable authentication. An empty value is not "open" — the service refuses to
# start. The value below is a local development placeholder and must not reach any deployed
# environment.
[auth]
internal_api_key = "observability_dev_key"

# How the secrets above are resolved at boot. `no_encryption` takes them literally; the KMS
# variants are compiled in under the `release` feature and treat them as handles to resolve.
[secrets_management]
secrets_manager = "no_encryption"

# Outbound HTTP proxy, if the pod cannot reach chat providers directly. A deployment fact, so it
# lives here once rather than on each destination.
[proxy]

# Chat destinations, keyed by the id a request names in its `destination` field. A request carries
# no channel id and no credential — only an id from this table.
#
# Ids set from the environment arrive lowercased and cannot contain `__`, because `config`
# lowercases every environment key and splits levels on `__`. The service refuses to start on an id
# that would not survive that, rather than failing to match it at lookup time.
#
#   OBSERVABILITY__CHAT__DESTINATIONS__SR_ALERTS__TYPE=xyne
#   OBSERVABILITY__CHAT__DESTINATIONS__SR_ALERTS__APP_JWT=...
#   OBSERVABILITY__CHAT__DESTINATIONS__SR_ALERTS__CHANNEL=...
#
# `type = "log"` accepts messages and delivers nothing. It exists so the whole path — guard, route,
# registry, response — can be exercised before real credentials exist. It logs sizes, never the
# message: this writes to the same stream as everything else and an alert body carries merchant ids
# and payment volumes.
[chat.destinations.smoke]
type = "log"

# A real Xyne destination looks like this. `base_url` defaults to production and `timeout_seconds`
# and `max_message_chars` to the client's own defaults, so a channel and a credential are all that
# is required.
#
# [chat.destinations.sr_alerts]
# type = "xyne"
# app_jwt = "..."
# channel = "..."
#
# Slack is the same client with a different base URL and credential, not a second integration.
#
# [chat.destinations.escalation]
# type = "slack"
# bot_token = "xoxb-..."
# channel = "..."

# The email transport, shared by every email destination. `external_services`' own configuration,
# so the backend selection and its validation are the router's, not a second copy of them.
#
# `NO_EMAIL_CLIENT` accepts and logs. That is the off switch and the default: no separate "email
# enabled" flag exists, because a backend that sends nothing already is one. A deployment runs with
# this until SES credentials exist.
#
#   active_email_client = "SES"          and an [email.aws_ses] section
#   active_email_client = "SMTP"         and an [email.smtp] section
#
# The transport is validated at boot only when destinations exist, so a service with no email
# destinations does not need a verified sender to start.
[email]
active_email_client = "NO_EMAIL_CLIENT"
sender_email = "alerts@example.com"
aws_region = ""

# Email destinations, keyed the same way as chat.
#
# One address per destination: `EmailClient::send_email` accepts a single recipient and both
# backends build a single-recipient message, so reaching three people is three destinations today.
# Widening it is tracked separately, and when it lands this becomes a list without any caller
# changing, since a request only ever names an id.
#
# A destination with no address fails the boot rather than accepting alerts and sending them
# nowhere.
[email.destinations.smoke]
to = "alerts@example.com"
