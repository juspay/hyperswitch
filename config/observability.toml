evaluation_periods = 1
description = "SEV2: RDS failover database CPU utilization is above 85% (Critical limit) for 5 minutes. High read traffic load detected."

[cloudwatch.alarms.rds-failover-cpu.severities.sev3]
threshold = 65.0
