# For documentation on how to configure this file,
# see diesel.rs/guides/configuring-diesel-cli

[print_schema]
file = "crates/diesel_models/src/schema.rs"
import_types = ["diesel::sql_types::*", "crate::enums::diesel_exports::*"]
generate_missing_sql_type_definitions = false
patch_file="crates/diesel_models/drop_id.patch"
# blocklist has no primary key, which print-schema refuses; the patch file restores its block.
# Anchored because this value is a regex - bare "blocklist" also matches the three sibling tables.
filter = { except_tables = ["^blocklist$"] }
