# For documentation on how to configure this file,
# see diesel.rs/guides/configuring-diesel-cli

# Diesel configuration used by the setup containers (`migration_runner` in
# `docker-compose.yml` / `docker-compose-development.yml`) and by
# `scripts/migration_runner_entrypoint.sh`.
#
# It deliberately has no `[print_schema]` section, unlike `diesel.toml`:
# `diesel migration run` regenerates `crates/diesel_models/src/schema.rs` when
# `print_schema` is configured, which requires `rustfmt` to be available and
# applies `crates/diesel_models/drop_id.patch` on top of the formatted output.
# The setup containers only need to apply migrations, and they do not ship
# `rustfmt`, so leaving `print_schema` out keeps them working and avoids
# rewriting `schema.rs` inside the user's checkout.
#
# `schema.rs` is still regenerated and verified by `just migrate` (which uses
# `diesel.toml`) and by the migration consistency check in CI.
