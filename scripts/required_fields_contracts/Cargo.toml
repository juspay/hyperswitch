[package]
name = "required-fields-api-contracts"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"
publish = false

# Test companion only; no router feature, endpoint or mutating service.
[workspace]

[dependencies]
superposition_sdk = { version = "=0.119.0", default-features = false, features = ["rt-tokio"] }
aws-smithy-runtime-api = { version = "=1.20.0", features = ["client", "http-1x"] }
aws-smithy-types = "=1.9.3"
aws-smithy-async = { version = "=1.3.1", features = ["rt-tokio"] }
tokio = { version = "=1.50.0", features = ["macros", "rt-multi-thread", "time", "sync", "process"] }
reqwest = { version = "=0.13.5", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.140"
clap = { version = "=4.5.38", features = ["derive"] }
error-stack = "=0.4.1"
sha2 = "=0.10.9"
