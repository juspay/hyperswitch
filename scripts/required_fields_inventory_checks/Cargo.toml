[package]
name = "required-fields-inventory-checks"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"
publish = false

# Compiles the actual router inventory modules by path; never a server certification harness.
[workspace]

[features]
default = ["required_fields_sync"]
required_fields_sync = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("vergen"))'] }

[dependencies]
clap = { version = "=4.5.38", default-features = false, features = ["std", "derive", "help", "usage"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.140", features = ["raw_value", "preserve_order"] }
sha2 = "=0.10.9"
toml = "=0.8.22"
error-stack = "=0.4.1"
thiserror = "=1.0.69"
time = { version = "=0.3.41", features = ["formatting", "parsing"] }
tokio = { version = "=1.50.0", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "=0.13.5", default-features = false }
superposition_sdk = { version = "=0.119.0", default-features = false, features = ["rt-tokio"] }

superposition_provider = "=0.119.0"
superposition_types = "=0.119.0"

[dev-dependencies]
aws-smithy-runtime-api = { version = "=1.20.0", features = ["client", "http-1x"] }
aws-smithy-types = "=1.9.3"
aws-smithy-async = { version = "=1.3.1", features = ["rt-tokio"] }
