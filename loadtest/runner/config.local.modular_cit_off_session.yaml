# Local fixed-rate benchmark for modular CIT off-session payments.
# Deployment endpoints are read from the local Docker Hub deploy config.
deployment_config: ../deploy/config.docker-hub.yaml

environment:
  mode: local

merchant:
  # Runner will create a fresh merchant for this run.
  mode: create

superposition:
  # Let the runner provision routing context in Superposition for this merchant.
  mode: manage

targets:
  # Keep these aligned with deploy config values.
  superposition:
    org_id: orgid215037391072690181
    workspace_id: dev
    # Router polls Superposition every 5 seconds; one extra second is sufficient
    # for smoke setup while keeping the complete run short.
    propagation_wait_seconds: 6

scenario:
  merchant_path: modular
  name: cit_off_session

load:
  starting_rps: 5
  target_rps: 5
  step_rps: 0
  hold_seconds: 1200
  idle_seconds: 0

fixtures:
  count: auto
  # Keep one slot free in modular PM's five-connection database pools. Some
  # setup operations acquire a second connection before releasing the first.
  concurrency: 4
  wait_before_start_seconds: 0
  fresh_merchant: true
  amount: 1000
  currency: USD
  session_expiry: 3600

payments_api:
  admin_api_key: test_admin
  connector_name: stripe_test
  request_timeout_ms: 30000
  card:
    card_number: "4242424242424242"
    card_exp_month: "10"
    card_exp_year: "35"
    card_holder_name: "Load Test"
    card_cvc: "123"

state_file: state/loadtest-modular-cit-off-session-5rps-20m.json
