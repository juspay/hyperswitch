# Deployment endpoints are read from this file; do not duplicate them here.
deployment_config: ../deploy/config.yaml

environment:
  mode: local

merchant:
  mode: create

superposition:
  mode: manage

scenario:
  # merchant_path: non_modular or modular
  merchant_path: modular
  # name: guest, cit_on_session, cit_off_session, or cit_metadata_changed
  name: cit_off_session

load:
  # A fixed-rate run uses equal starting/target RPS and step_rps: 0.
  # A ramp holds each rate for hold_seconds and waits idle_seconds between phases.
  starting_rps: 5
  target_rps: 15
  step_rps: 2
  hold_seconds: 40
  idle_seconds: 10

fixtures:
  # auto creates enough fixtures for every request across all load phases.
  count: auto
  # Fixture concurrency affects preparation only, not measured request RPS.
  concurrency: 20
  # Minimum delay after fixtures are ready and before measured traffic begins.
  wait_before_start_seconds: 0
  # true creates a new isolated merchant before preparing fixtures.
  fresh_merchant: true
  amount: 1000
  currency: USD
  session_expiry: 900

payments_api:
  # Local admin credential used only to provision load-test merchants.
  # Use admin_api_key_env instead when the credential should come from an environment variable.
  admin_api_key: test_admin
  # Dummy connector configured during merchant preparation.
  connector_name: stripe_test
  request_timeout_ms: 30000
  # cit_metadata_changed saves this card during fixture preparation, then
  # synchronously replaces its metadata during the measured confirm.
  card:
    card_number: "4242424242424242"
    card_exp_month: "10"
    card_exp_year: "35"
    card_holder_name: "Load Test"
    card_cvc: "123"
  # The measured confirm keeps the PAN/CVC and applies these changes.
  metadata_update:
    card_exp_month: "11"
    card_exp_year: "36"
    card_holder_name: "Updated Load Test"

# Runner-owned merchant, fixture, run, and request-result state.
state_file: state/loadtest.json
