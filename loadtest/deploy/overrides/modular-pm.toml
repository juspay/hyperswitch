[server]
host = "0.0.0.0"
port = 8081

[log.console]
enabled = true
level = "INFO"
log_format = "json"

[log.telemetry]
traces_enabled = false
metrics_enabled = true
ignore_errors = false
otel_exporter_otlp_endpoint = "http://127.0.0.1:4317"

[dummy_connector]
enabled = true
payment_duration = 1
payment_tolerance = 1

[superposition]
endpoint = "{{SUPERPOSITION_BASE_URL}}"
org_id = "{{SUPERPOSITION_ORG_ID}}"
workspace_id = "{{SUPERPOSITION_WORKSPACE_ID}}"
polling_interval = 5

[jwekey]
vault_encryption_key = """
{{VAULT_PUBLIC_KEY}}
"""
rust_locker_encryption_key = """
{{VAULT_PUBLIC_KEY}}
"""
vault_private_key = """
{{VAULT_PRIVATE_KEY}}
"""
