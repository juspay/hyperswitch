global:
  scrape_interval: 1s
  evaluation_interval: 1s
scrape_configs:
  - job_name: applications
    static_configs:
      - targets: ["127.0.0.1:8889"]

  - job_name: cadvisor
    static_configs:
      - targets: ["127.0.0.1:18082"]
  - job_name: vault
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:9090"]
