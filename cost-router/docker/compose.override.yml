# Used with: docker compose -f docker-compose.yml -f cost-router/docker/compose.override.yml ...
# The prebuilt :standalone image is older than repo HEAD config, so we mount a trimmed config copy.
services:
  hyperswitch-server:
    pull_policy: never
    volumes: !override
      - ./cost-router/docker/config:/local/config
  superposition-init:
    volumes: !override
      - ./config/superposition_seed.toml:/seed.toml:ro
      - ./cost-router/docker/seed_superposition.sh:/seed_superposition.sh:ro
    command: sh -c "apk add --no-cache bash curl jq yq && bash /seed_superposition.sh"
